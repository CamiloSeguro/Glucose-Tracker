name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write  # create releases on tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Test and build
        shell: cmd
        run: build.bat --ci

      - name: Package plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # StreamDock expects the .sdPlugin folder at the root of the archive
          Compress-Archive -Path com.cgm.freestyle.sdPlugin -DestinationPath dist/com.cgm.freestyle.sdPlugin.zip

      - uses: actions/upload-artifact@v4
        with:
          name: com.cgm.freestyle.sdPlugin
          path: dist/com.cgm.freestyle.sdPlugin.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/com.cgm.freestyle.sdPlugin.zip
          generate_release_notes: true
